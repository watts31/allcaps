name: One-time cap page download
on:
  push:
    paths: ['.github/workflows/fetch-cap-source.yml']
permissions:
  contents: write
jobs:
  get:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p capsrc
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          for t in washington_capitals philadelphia_flyers; do curl -sL -A "$UA" "https://capwages.com/teams/$t" -o capsrc/capwages_$t.html || true; done
          for t in washington-capitals philadelphia-flyers; do curl -sL -A "$UA" "https://puckpedia.com/team/$t" -o capsrc/puckpedia_$t.html || true; done
          ls -la capsrc
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add capsrc && git commit -m "Temporary: cap source pages" && git pull --rebase && git push
